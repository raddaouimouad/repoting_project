services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocp_reporting_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/reporting_db
      - JWT_SECRET=ocp_secure_jwt_production_key_2026
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: ocp_reporting_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
